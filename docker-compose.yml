services:
  postgres:
    image: postgres:16
    container_name: catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  catalog-1:
    build: ./services/catalog
    container_name: catalog-1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://catalog_user:catalog_password@postgres:5432/catalog_db
      PORT: 3000
    depends_on:
      - postgres

  catalog-2:
    build: ./services/catalog
    container_name: catalog-2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://catalog_user:catalog_password@postgres:5432/catalog_db
      PORT: 3000
    depends_on:
      - postgres

  catalog-3:
    build: ./services/catalog
    container_name: catalog-3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://catalog_user:catalog_password@postgres:5432/catalog_db
      PORT: 3000
    depends_on:
      - postgres

  load-balancer:
    image: nginx:alpine
    container_name: catalog-load-balancer
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-1
      - catalog-2
      - catalog-3

volumes:
  postgres_data:
